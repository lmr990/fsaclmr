webcam_path_node:
  ros__parameters:
    # ---- image source ----
    source: "camera"            # "camera" | "file"
    camera_device: 0
    image_files: ""             # glob for source:=file, e.g. "~/frames/*.png"
    loop_files: true
    fps_limit: 15.0

    # ---- YOLO (same model as the sim pipeline) ----
    tcone_yolo_path: ""         # empty -> default ~/qutms_ws/src/TCone-YOLO-main
    weights: ""
    data_yaml: ""
    imgsz: 640
    conf_thres: 0.15
    iou_thres: 0.45
    max_det: 100
    device: "0"                 # GPU; use "" to auto, "cpu" to force CPU
    half: false                 # set true (GPU) for ~2x faster inference

    # ---- monocular geometry ----
    distance_method: "size"     # "size" (no calibration needed) | "ground" (needs height+pitch)
    cone_real_height: 0.325     # FSAC small cone height [m]
    camera_height: 0.35         # lens height above ground [m] (ground method)
    camera_pitch_deg: 15.0      # downward tilt [deg] (ground method)
    intrinsics_file: ""         # e.g. "~/webcam_intrinsics.yaml" from webcam_calibrate
    fov_h_deg: 65.0             # fallback horizontal FOV if no calibration
    min_range: 0.4
    max_range: 12.0

    # ---- io ----
    publish_topic: "slam/cone_detection"
    frame_id: "track"
    path_topic: "/planning/midline_path"
    annotated_topic: "/webcam/annotated_image"
    display: true
    save_debug_png: ""
