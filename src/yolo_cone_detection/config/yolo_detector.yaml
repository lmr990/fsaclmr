yolo_detector_node:
  ros__parameters:
    # ---- Paths ----
    # Absolute path to the TCone-YOLO repository root. Leave empty to
    # auto-detect (QUTMS_TCONE_YOLO_PATH, ~/qutms_ws/src, or the workspace
    # containing this package), so copies of the workspace both work.
    tcone_yolo_path: ""

    # Paths below are resolved relative to tcone_yolo_path if not absolute.
    weights: "compared-results/model/TCone-YOLO_model/weights/best.pt"
    data_yaml: "data/Cone.yaml"

    # ---- Inference ----
    imgsz: 416
    # Real-scene value (shadows, floor texture and background objects pass
    # at 0.15); the 0.15 sim value lives in the sim-only overrides if needed.
    conf_thres: 0.25
    iou_thres: 0.45
    max_det: 1000
    # Force CUDA; the GPU is shared with Gazebo's camera rendering so we
    # also enable FP16 and lower the Gazebo camera rate/resolution to keep
    # the CUDA queue short.
    device: "cuda:0"
    half: true  # FP16 on RTX 3060 ~2x faster, still accurate for cones
    # Detection timer period [s]. Lower = higher detection rate, but inference
    # takes ~0.1-0.3 s, so the timer self-paces and never queues frames.
    process_period_sec: 0.1

    # ---- Output ----
    output_frame: "track"
    min_range: 0.5
    # Match the simulated ZED2i depth sensor effective range (~15m).
    max_range: 15.0
    # Cone heights for the size gate, FSAC/FSG rule values (small 0.305 m,
    # large orange 0.505 m). The image cannot separate small from large
    # orange cones, so orange-class boxes are gated against the whole
    # [small, large] band; blue/yellow against the small height both sides.
    cone_large_height: 0.505
    # Depth sample missing / outside [min_range, max_range]: drop the box
    # (default). true = estimate the distance from the box height instead —
    # that invents positions for mis detections AND real cones (ZED depth
    # holes at cone edges / against sunlight are common); experiments only.
    depth_size_fallback: false

    # Geometric consistency gate: a real cone's apparent pixel height must
    # match the sampled depth, h_px ≈ fy * H / z. The ratio (actual/expected
    # box height) is distance independent:
    #   - far too SHORT -> only part of the cone is visible (hand, person
    #     walking past): the depth window landed on the occluder, which is
    #     closer than the cone — the classic ghost-cone source;
    #   - far too TALL  -> not a cone at that distance (e.g. a marshal in an
    #     orange vest detected as an orange cone).
    # Boxes clipped by the top/bottom frame edge lose apparent height, so
    # the too-short half is skipped for them (too-tall still applies).
    # Tolerance band is a PRIOR, not calibrated (待标定): max_ratio 2.0 keeps
    # 0.505 m large orange cones while rejecting standing people; the
    # calibration plan is in docs/occlusion_ghost_acceptance.md.
    size_gate: true
    size_gate_min_ratio: 0.55
    size_gate_max_ratio: 2.0

    # ---- Topics ----
    image_topic: "/zed2i/zed_node/rgb/image_rect_color"
    depth_topic: "/zed2i/zed_node/depth/depth_registered"
    camera_info_topic: "/zed2i/zed_node/rgb/camera_info"
    publish_topic: "slam/cone_detection"