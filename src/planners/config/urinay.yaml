# Parameters for the urinay adapter nodes (cone_id_mapper + urinay_path_bridge).
# The urinay C++ node's own parameters live in the urinay package
# (urinay/config/urinay.yaml).
cone_id_mapper_node:
  ros__parameters:
    input_topic: /mapping/cone_map
    output_topic: /urinay/cone_map
    assoc_dist: 1.0
    dedupe_radius: 1.0

urinay_path_bridge_node:
  ros__parameters:
    map_frame: track
    partial_topic: /AS/P/pathlimits/partial
    full_topic: /AS/P/pathlimits/full
    path_topic: /planning/midline_path
    path_with_speeds_topic: /planning/path_with_speeds
    publish_rate: 10.0
    path_timeout_sec: 1.0
    curvature_smoothing_window: 3
    velocity_topic: /vehicle/velocity
    use_velocity_seed: true
    speed_profile:
      speed_cap: 1.5
      max_lateral_acc: 3.0
      max_accel: 1.0
      max_brake: 2.0
      min_speed: 0.8
      curvature_lookahead_m: 5.0
      decel_to_stop_at_end: true
